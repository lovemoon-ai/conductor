# Conductor-owned DeepSeek Harness runtime composition for the ai-sdk `dsh`
# backend. Launched by src/providers/dsh-sdk-session.js through
# @deepseek-ai/dsh-sdk-client (stdio JSON-RPC); stdout is reserved for
# JSON-RPC, so no console logger or terminal UI may be mounted here.
#
# Modeled on deepseek-harness's examples/jsonrpc-agent/cordis.yml (the
# upstream unattended coding-agent reference) and the Python SDK's bundled
# zero-config composition. Plugin versions are pinned in package.json; bare
# plugin names resolve from this file's directory up into the ai-sdk
# node_modules tree.
#
# Environment contract (set by DshSdkSession when spawning the runtime):
#   DEEPSEEK_API_KEY   required; resolved by the llm-deepseek adapter
#   DEEPSEEK_BASE_URL  optional API endpoint override
#   DSH_CWD            workspace directory for bash/fs tools
#   DSH_SESSION_ROOT   JSONL session persistence root
#   DSH_SYSTEM_PROMPT  optional persona override

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Stock DeepSeek adapter. Resolves DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL from
# the launching environment; nothing secret is inlined here.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

# Managed child-process groups for the bash executor.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

# Agent spine: agent loop, system prompt, core coding tools.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext:
      maxBytes: 65536

# JSONL persistence. Compression stays off so the resume dispatcher
# (src/resume/dsh.js) can read the header line back for cwd recovery.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Subagent delegation (in-process spawn provider).
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Filesystem tools.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Token accounting + context compaction.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
