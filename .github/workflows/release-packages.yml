name: Release Packages

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - ".github/workflows/release-packages.yml"
      - ".github/workflows/cli-release-archives.yml"
      - "package.json"
      - "package-lock.json"
      - "cli/**"
      - "modules/ai-sdk/**"
      - "modules/ai-manager/**"
      - "modules/app-sdk/**"
      - "modules/conductor-sdk/**"
      - "scripts/release-packages.mjs"
      - "scripts/release-verify.sh"
      - "scripts/dispatch-cli-release-archive.sh"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce notes-before-release gate
        # claw/notes-before-release/ is a hard gate per claw/sop/06_release.md:
        # any file other than README.md represents a pre-release item that
        # must be resolved, accepted, or promoted to claw/lessons/ /
        # claw/issues/ BEFORE a release ships. This step blocks the entire
        # release-packages workflow if the directory is non-empty, so the
        # "version PR merge" event cannot accidentally publish past an open
        # acceptance gate.
        shell: bash
        run: |
          set -euo pipefail
          # README.md is the steady-state placeholder; .gitkeep keeps the
          # empty dir tracked. Anything else here is a real pre-release
          # note that must be resolved before shipping.
          notes=$(find claw/notes-before-release -mindepth 1 -maxdepth 1 -type f -name '*.md' ! -name README.md 2>/dev/null || true)
          if [[ -n "$notes" ]]; then
            echo "::error::claw/notes-before-release/ is non-empty. The release SOP treats this as a hard gate."
            echo "Open notes blocking this release:"
            echo "$notes"
            echo "Resolve each item, then either tick all checkboxes and delete the file, or promote it to claw/lessons/ or claw/issues/ with an explicit accept rationale."
            exit 1
          fi
          echo "OK: claw/notes-before-release/ contains only README.md."

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        shell: bash
        run: npm install --global "npm@^11.5.1"

      - name: Hide subpackage pnpm-lock files so changesets uses npm publish
        # Each package under cli/ and modules/* keeps its own pnpm-lock.yaml so
        # local developers can run `pnpm test` per-package. `changeset publish`
        # inspects each package's lockfile to pick a package manager and would
        # otherwise spawn `pnpm publish`. Installing pnpm on the runner ran
        # into a corepack-shim conflict (root package.json declares
        # `packageManager: npm`). It's simpler to just delete the lockfiles
        # inside the workflow's working copy so changesets falls back to npm
        # publish — which is what we use everywhere else in this workflow.
        # The repo itself is unchanged; the next checkout restores the files.
        shell: bash
        run: |
          find cli modules -maxdepth 2 -name pnpm-lock.yaml -print -exec rm -f {} +

      - name: Show tool versions
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install release workspace dependencies
        shell: bash
        run: npm ci

      - name: Version packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:version
          commit: version packages
          title: version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect unpublished package versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: release_status
        shell: bash
        run: npm run release:status

      - name: Verify release workspace
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release_status.outputs.pending_count != '0'
        shell: bash
        run: npm run release:verify

      - name: Publish npm packages
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.release_status.outputs.pending_count != '0'
        id: publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
        shell: bash
        run: npm run release:publish

      - name: Trigger CLI archive workflow
        if: steps.publish.outputs.cli_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: npm run release:dispatch-cli-archive -- "${{ steps.publish.outputs.cli_version }}"
