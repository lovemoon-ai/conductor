name: PR Checks

# Pre-merge gates derived from the 0.3.0 release retro
# (claw/lessons/arch_release-packages-pnpm-changesets-20260512.md and
# claw/lessons/arch_cosmetic-prisma-drift-accepted-20260512.md).
#
# Each job fails fast with an actionable `::error::` message so the PR
# author knows exactly what to do. None of these checks need write
# access; everything runs from `actions/checkout` on the PR head.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  # On PR events the ref is refs/pull/N/merge (unique per PR). On push to main
  # there is exactly one ref. Either way `github.ref` is a stable concurrency
  # key without the `||` fallback that tripped GitHub's expression parser
  # when this workflow was first introduced in 781b154.
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prisma-drift:
    name: Prisma schema vs migrations
    # Run on every PR and on every push to main so a merge that bypasses
    # PR review (force-push, admin override) still surfaces drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check whether the PR touches schema or migrations
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            diff_range="$base...$head"
          else
            diff_range="${{ github.event.before }}..${{ github.sha }}"
          fi
          touched=$(git diff --name-only "$diff_range" -- web/prisma/ || true)
          if [[ -z "$touched" ]]; then
            echo "Scope: no web/prisma/ changes in this diff — skipping drift check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Scope: touched files:"
            echo "$touched"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install prisma CLI only
        if: steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Avoid full `npm ci` in web/ — we only need the prisma CLI to
          # compare migrations vs schema.prisma. Pin to the version
          # declared in web/package.json so this check uses the same
          # engine the deploy uses.
          version=$(node -p "require('./web/package.json').devDependencies?.prisma || require('./web/package.json').dependencies?.prisma")
          version=${version#^}
          version=${version#~}
          echo "Installing prisma@$version"
          npm install --global "prisma@$version" "@prisma/engines@$version"

      - name: prisma migrate diff
        if: steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd web

          # Tables whose schema.prisma vs migration drift is explicitly
          # accepted in claw/lessons/arch_cosmetic-prisma-drift-accepted-20260512.md.
          # The drift is cosmetic (NULL vs NOT NULL on default-having columns,
          # CURRENT_TIMESTAMP default mismatch on @updatedAt) and would require
          # an invasive SQLite table rewrite to fix. New PRs are allowed to
          # leave these tables drifting, but introducing drift on any OTHER
          # table or table-rewrite is a fail.
          ACCEPTED_DRIFT_TABLES=(agent_outbox user_preferences user_catchphrases)

          rm -f prisma/_pr_checks_shadow.db

          # Capture stdout+stderr so we can parse it for "Redefined table"
          # markers. Disable pipefail temporarily because prisma exits 2
          # on drift, which is exactly the signal we want to interpret.
          set +e
          diff_output=$(prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "file:./prisma/_pr_checks_shadow.db" \
            --exit-code 2>&1)
          code=$?
          set -e
          rm -f prisma/_pr_checks_shadow.db

          echo "$diff_output"

          if [[ "$code" == "0" ]]; then
            echo "OK: schema.prisma matches prisma/migrations/ exactly."
            exit 0
          fi
          if [[ "$code" != "2" ]]; then
            echo "::error::prisma migrate diff returned unexpected exit code $code"
            exit "$code"
          fi

          # Parse "[*] Redefined table `<name>`" lines.
          redefined=$(echo "$diff_output" | grep -oE 'Redefined table `[^`]+`' | sed -E 's/Redefined table `([^`]+)`/\1/' | sort -u)
          unaccepted=""
          while IFS= read -r table; do
            [[ -z "$table" ]] && continue
            accepted=0
            for ok in "${ACCEPTED_DRIFT_TABLES[@]}"; do
              if [[ "$table" == "$ok" ]]; then
                accepted=1
                break
              fi
            done
            if [[ "$accepted" == "0" ]]; then
              unaccepted="$unaccepted $table"
            fi
          done <<< "$redefined"

          # Also fail if the diff contains any non-redefinition drift signal
          # (e.g. CREATE TABLE / DROP TABLE / ADD COLUMN that the parser
          # might miss). Be conservative: only redefined-tables drift is
          # treated as "potentially accepted".
          non_redefine_drift=$(echo "$diff_output" | grep -E '^\[[*+-]\]' | grep -vE 'Redefined table' || true)

          if [[ -n "$unaccepted" || -n "$non_redefine_drift" ]]; then
            # Print as a single grouped block so it shows up cleanly
            # in the Actions UI alongside the diff_output above.
            echo "::error::schema.prisma diverges from prisma/migrations/ in a way not covered by the accepted-drift list. See claw/lessons/arch_cosmetic-prisma-drift-accepted-20260512.md and arch_release-packages-pnpm-changesets-20260512.md."
            echo ""
            echo "New drift in this PR:"
            echo "  unaccepted redefined tables: ${unaccepted:-(none)}"
            echo "  other drift signals:"
            echo "$non_redefine_drift" | sed 's/^/    /'
            echo ""
            echo "Fix one of these:"
            echo "  1. Generate a migration:"
            echo "       cd web && npx prisma migrate dev --name <descriptive-name>"
            echo "     and commit the new prisma/migrations/* directory."
            echo "  2. If drift is intentional + cosmetic-only, document it in"
            echo "     claw/lessons/arch_cosmetic-prisma-drift-accepted-20260512.md"
            echo "     and extend ACCEPTED_DRIFT_TABLES in .github/workflows/pr-checks.yml."
            echo ""
            echo "NEVER paper over the drift on production with 'prisma db push'."
            exit 1
          fi

          echo "OK: only previously-accepted cosmetic drift remains (${ACCEPTED_DRIFT_TABLES[*]})."

  changeset-presence:
    name: Changeset required for published-package changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change scope vs PR base
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          # Files under any published-package path
          touched_published=$(git diff --name-only "$base...$head" \
            -- 'cli/**' 'modules/ai-sdk/**' 'modules/app-sdk/**' 'modules/chat-web/**' 'modules/conductor-sdk/**' \
            | grep -vE '(^cli/CHANGELOG\.md$|^modules/[^/]+/CHANGELOG\.md$|/\.gitignore$|/README\.md$|/dist/)' \
            || true)

          # Newly added changeset markdown files (excluding README + config)
          new_changesets=$(git diff --name-only --diff-filter=A "$base...$head" -- '.changeset/*.md' \
            | grep -vE '(^\.changeset/README\.md$|^\.changeset/config\.json$)' \
            || true)

          # The generated version PR consumes and deletes its source changesets.
          consumed_changesets=$(git diff --name-only --diff-filter=D "$base...$head" -- '.changeset/*.md' \
            | grep -vE '(^\.changeset/README\.md$|^\.changeset/config\.json$)' \
            || true)

          {
            echo 'touched_published<<EOF'
            echo "$touched_published"
            echo 'EOF'
            echo 'new_changesets<<EOF'
            echo "$new_changesets"
            echo 'EOF'
            echo 'consumed_changesets<<EOF'
            echo "$consumed_changesets"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$touched_published" ]]; then
            echo "Touched published-package files:"
            echo "$touched_published"
          else
            echo "No published-package files touched."
          fi
          if [[ -n "$new_changesets" ]]; then
            echo "New changeset(s):"
            echo "$new_changesets"
          fi
          if [[ -n "$consumed_changesets" ]]; then
            echo "Consumed changeset(s):"
            echo "$consumed_changesets"
          fi

      - name: Enforce
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          touched='${{ steps.detect.outputs.touched_published }}'
          changesets='${{ steps.detect.outputs.new_changesets }}'
          consumed='${{ steps.detect.outputs.consumed_changesets }}'
          if [[ "$HEAD_REF" == "changeset-release/main" && -n "$consumed" ]]; then
            echo "OK: generated version packages PR consumes existing changesets."
            exit 0
          fi
          if [[ -n "$touched" && -z "$changesets" ]]; then
            echo "::error::This PR modifies a published package (cli/ or modules/*) but does not include a .changeset/*.md file. Run 'npm run changeset' and commit the result. See claw/lessons/arch_release-packages-pnpm-changesets-20260512.md."
            echo ""
            echo "The release workflow auto-generates the public CHANGELOG from changesets."
            echo "Without one, your change ships in the next release with NO release-notes entry,"
            echo "exactly the way 20+ commits silently slipped past in 0.3.0."
            echo ""
            echo "Fix:"
            echo "  npm run changeset"
            echo "  # follow the prompts, pick patch/minor/major, write a one-paragraph"
            echo "  # release-notes blurb, and commit the generated .changeset/*.md."
            echo ""
            echo "If this PR is genuinely release-neutral (docs-only, test-only,"
            echo "internal refactor with no behavior change), add a changeset with 'patch'"
            echo "bump and leave the body empty."
            exit 1
          fi
          echo "OK: either no published-package change, or a changeset is present."

  changeset-no-db-push:
    name: Changeset must not instruct `db push`
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint touched changeset markdown
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          touched=$(git diff --name-only --diff-filter=AM "$base...$head" -- '.changeset/*.md' \
            | grep -vE '(^\.changeset/README\.md$)' \
            || true)

          if [[ -z "$touched" ]]; then
            echo "No changeset files added/modified — skipping."
            exit 0
          fi

          bad_files=""
          for f in $touched; do
            # Match: `db push`, `db:push`, `prisma db push`, `pnpm ... db:push`, etc.
            # Case-insensitive, ERE.
            if grep -iEn 'db[:[:space:]]+push|prisma[[:space:]]+db[[:space:]]+push' "$f" >/dev/null; then
              echo "::group::$f"
              grep -niE 'db[:[:space:]]+push|prisma[[:space:]]+db[[:space:]]+push' "$f" || true
              echo "::endgroup::"
              bad_files="$bad_files $f"
            fi
          done

          if [[ -n "$bad_files" ]]; then
            echo "::error::A changeset file in this PR tells operators to run 'db push'. Production deploys use 'prisma migrate deploy' which only replays migrations. 'db push' bypasses the migrations table and creates drift. See claw/lessons/arch_release-packages-pnpm-changesets-20260512.md."
            echo ""
            echo "Bad changeset file(s):$bad_files"
            echo ""
            echo "Fix:"
            echo "  1. Generate a proper migration:"
            echo "       cd web && npx prisma migrate dev --name <descriptive-name>"
            echo "  2. Edit the changeset to describe the schema change WITHOUT the"
            echo "     'db push' instruction. The deploy SOP already runs migrate"
            echo "     deploy automatically; consumers don't need any extra step."
            exit 1
          fi
          echo "OK: no 'db push' instructions in touched changesets."

  cli-api-parity:
    name: CLI covers every web API route
    # AGENTS.md: anything the web UI can do, the `conductor` CLI must do too.
    # cli/api-parity.json maps every web/src/app/api route + method to a CLI
    # command (or a skip reason); the test fails for unmapped routes, stale
    # entries, and mapped commands that do not exist.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reject lockfile links into a local pnpm store
        shell: bash
        # Running `npm install` at the root while cli/ or modules/* still have a
        # pnpm-installed node_modules records their deps as `"link": true` into
        # `node_modules/.pnpm/...` on that machine. `npm ci` then installs none
        # of them (the CLI could not even load yargs). Regenerate from a clean
        # checkout with no node_modules: `npm install --package-lock-only`.
        run: |
          set -euo pipefail
          bad=$(node -e '
            const lock = require("./package-lock.json");
            const hits = Object.entries(lock.packages || {})
              .filter(([, v]) => v.link && String(v.resolved || "").includes(".pnpm"))
              .map(([k, v]) => `${k} -> ${v.resolved}`);
            console.log(hits.join("\n"));
          ')
          if [[ -n "$bad" ]]; then
            echo "::error::package-lock.json links packages into a local pnpm store. Regenerate it from a clean checkout (no node_modules) with 'npm install --package-lock-only'."
            echo "$bad"
            exit 1
          fi

      - name: Install workspace dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build the SDKs the CLI imports
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace @love-moon/ai-sdk
          npm run build --workspace @love-moon/conductor-sdk

      - name: Check CLI / web API parity
        shell: bash
        run: |
          set -euo pipefail
          if ! node --test cli/test/api-parity.test.js; then
            echo "::error::A web API route is not covered by the CLI. Add the matching \`conductor\` command and map the route in cli/api-parity.json (or give a \`skip\` reason for daemon internals, sign-in, billing, webhooks, cron)."
            exit 1
          fi
