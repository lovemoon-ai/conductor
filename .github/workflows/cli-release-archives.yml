name: Build CLI Release Archives

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to package"
        required: false
        type: string
      publish_release:
        description: "Upload build outputs to a GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0

      - name: Resolve release metadata
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish_release="true"
          elif [[ -n "${{ inputs.version || '' }}" ]]; then
            version="${{ inputs.version }}"
            publish_release="${{ inputs.publish_release && 'true' || 'false' }}"
          else
            version="$(node -p "require('./cli/package.json').version")"
            publish_release="${{ inputs.publish_release && 'true' || 'false' }}"
          fi

          if [[ -z "$version" ]]; then
            echo "Unable to determine CLI version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
          - runner: ubuntu-24.04
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
          registry-url: https://registry.npmjs.org

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/build-cli-release.sh
          ./scripts/build-cli-release.sh "${{ needs.prepare.outputs.version }}" "${{ matrix.os }}" "${{ matrix.arch }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: conductor-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist/release/conductor-v${{ needs.prepare.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: cli/dist/release
          merge-multiple: true

      - name: Render Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/render-homebrew-formula.sh
          ./scripts/render-homebrew-formula.sh "${{ needs.prepare.outputs.version }}"

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./scripts/extract-changelog-release-notes.sh
          ./scripts/extract-changelog-release-notes.sh "${{ needs.prepare.outputs.version }}" cli/dist/release-notes.md

      - name: Upload formula artifact
        uses: actions/upload-artifact@v4
        with:
          name: conductor-homebrew-formula
          path: cli/Formula/conductor.rb
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_NOTES_FILE: cli/dist/release-notes.md
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
          fi

          gh release upload "$RELEASE_TAG" cli/dist/release/* cli/Formula/conductor.rb --clobber

      - name: Require Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "Missing required secret HOMEBREW_TAP_TOKEN for updating lovemoon-ai/homebrew-tap" >&2
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: lovemoon-ai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew tap formula
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p homebrew-tap/Formula
          cp cli/Formula/conductor.rb homebrew-tap/Formula/conductor.rb

          cd homebrew-tap
          ruby -c Formula/conductor.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/conductor.rb

          if git diff --cached --quiet; then
            echo "Homebrew tap formula is already up to date."
            exit 0
          fi

          git commit -m "conductor ${{ needs.prepare.outputs.version }}"
          git push
